- name: Deploy Laravel three-tier app on Kubernetes
  hosts: local
  become: no
  vars:
    repo_url: https://github.com/trixsolution/trixsolution-cloud-docker.git
    app_dir: "{{ lookup('env', 'HOME') }}/laravel-deploy"
  tasks:
    - name: Get the latest code from GitHub
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes

    - name: Start minikube if it is not running
      shell: minikube status >/dev/null 2>&1 || minikube start --driver=docker
      changed_when: false

    - name: Build the Laravel image with Docker
      command: docker build --load -t laravel-app:1.0 .
      args:
        chdir: "{{ app_dir }}"

    - name: Load the image into minikube
      command: minikube image load laravel-app:1.0

    - name: Apply all Kubernetes files
      command: kubectl apply -f k8s/
      args:
        chdir: "{{ app_dir }}"

    - name: Restart Laravel pods so they use the new image
      command: kubectl rollout restart deployment/laravel-app -n laravel

    - name: Wait for MySQL (database tier)
      command: kubectl rollout status deployment/mysql -n laravel --timeout=300s

    - name: Wait for Laravel (application tier)
      command: kubectl rollout status deployment/laravel-app -n laravel --timeout=300s

    - name: Wait for Nginx (presentation tier)
      command: kubectl rollout status deployment/nginx-frontend -n laravel --timeout=300s

    - name: Run database migrations
      command: kubectl exec -n laravel deploy/laravel-app -- php artisan migrate --force
      register: migrate
      retries: 6
      delay: 10
      until: migrate.rc == 0

    - name: Get the minikube IP
      command: minikube ip
      register: mk_ip
      changed_when: false

    - name: Check the app answers
      uri:
        url: "http://{{ mk_ip.stdout }}:30080"
        status_code: 200
      register: web
      retries: 10
      delay: 5
      until: web.status == 200

    - name: Show the URL
      debug:
        msg: "App is live at http://{{ mk_ip.stdout }}:30080"
